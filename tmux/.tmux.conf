# ============================================================
# TMUX
# ============================================================

# Prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Mouse
set -g mouse on

# History
set -g history-limit 100000

# Faster escape response
set -sg escape-time 10

# Window / pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Don't rename windows automatically
set -g allow-rename off
set -g automatic-rename off

# ============================================================
# Terminal / True Color
# ============================================================

set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"

# ============================================================
# Current directory for new windows/panes
# ============================================================

bind c new-window -c "#{pane_current_path}"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================================
# Pane navigation - Vim style
# ============================================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================================
# Pane resizing
# ============================================================

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================================
# Reload
# ============================================================

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ============================================================
# Copy mode
# ============================================================

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================================
# COLORS
#
# Matching the Alacritty palette
#
# Background: #0b0f14
# Foreground: #d8dee9
# Blue:       #81a1c1
# Cyan:       #88c0d0
# Purple:     #b48ead
# Green:      #a3be8c
# Yellow:     #ebcb8b
# Red:        #bf616a
# ============================================================

# Main tmux status bar
set -g status-style "bg=#0b0f14,fg=#d8dee9"

# Left side: session name
set -g status-left-length 40
set -g status-left "#[fg=#88c0d0,bold] #S #[fg=#4c566a]│ "

# Right side
set -g status-right-length 100
set -g status-right "#[fg=#4c566a]│ #[fg=#81a1c1]%Y-%m-%d #[fg=#88c0d0]%H:%M "

# Window tabs
setw -g window-status-format \
    "#[fg=#4c566a] #I #[fg=#d8dee9]#W "

# Active window
setw -g window-status-current-format \
    "#[fg=#0b0f14,bold,bg=#81a1c1] #I:#W #[default]"

# Window separator
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#2e3440"
set -g pane-active-border-style "fg=#81a1c1"

# Pane titles
set -g display-panes-active-colour "#88c0d0"
set -g display-panes-colour "#4c566a"

# tmux command messages
set -g message-style "bg=#2e3440,fg=#d8dee9"

# Copy mode message
set -g mode-style "bg=#81a1c1,fg=#0b0f14"

# ============================================================
# Activity
# ============================================================

setw -g monitor-activity on
set -g visual-activity off

# ============================================================
# Status refresh
# ============================================================

set -g status-interval 2
