# ============================================================
# STARSHIP
# ============================================================

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$golang\
$rust\
$kubernetes\
$terraform\
$docker_context\
$aws\
$cmd_duration
$character
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"

[python]
symbol = " "
format = "[$symbol$virtualenv]($style) "
style = "yellow"

[golang]
symbol = " "
format = "[$symbol$version]($style) "

[rust]
symbol = "󱘗 "

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[$symbol$context(\\($namespace\\))]($style) "
style = "bold blue"

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace]($style) "

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "

[aws]
symbol = " "
format = "[$symbol$profile(\\($region\\))]($style) "

[cmd_duration]
min_time = 2000
format = "took [$duration](yellow) "
